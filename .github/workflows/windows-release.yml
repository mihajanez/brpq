name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0); creates tag v<version>"
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install dimod dwave-samplers minorminer dwave-system qiskit qiskit-aer qiskit-ibm-runtime matplotlib pylatexenc
      - name: Build app
        shell: bash
        run: |
          pyinstaller --noconfirm --name brpq --onedir --console \
            --add-data "gui/static;gui/static" --add-data "data;data" \
            --add-data "hpc;hpc" --add-data "qaoa_qubo.py;." --add-data "load_qubo.py;." \
            --collect-all qiskit_aer --collect-all dwave \
            gui/launcher.py
          # place resources where gui.runner expects ROOT (the bundle's _internal dir)
          if [ -f rbrp_ip.exe ]; then cp rbrp_ip.exe dist/brpq/_internal/; fi
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\brpq.iss
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: BRPQ ${{ env.VERSION }}
          files: dist/brpq-setup-${{ env.VERSION }}.exe
